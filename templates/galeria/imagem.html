{% extends 'shared/base.html' %} {% load static %} {% block content %}
<main class="principal">
  {% include 'partials/_sidebar.html' %}

  <section class="conteudo">
    <section class="imagem">
      <div class="imagem__conteudo">
        {% if not foto.foto %}
        <img
          class="imagem__imagem"
          src="{% static 'assets/imagens/galeria/not-found.png'%}"
        />
        {% else %}
        <img class="imagem__imagem" src="{{ foto.foto.url }}" />
        {% endif %}
        <div class="imagem__info">
          <div class="imagem__texto">
            <p class="imagem__titulo">{{ foto.nome }}</p>
            <p class="imagem__descricao">{{ foto.legenda }}</p>
            <p class="imagem__texto">{{ foto.descricao }}</p>
          </div>
          <div>
            <a href="{% url 'editar_imagem' foto_id=foto.id %}"
              ><button class="btn btn-success col-12" style="padding: top 5px">
                Editar
              </button></a
            >
            <a href="{% url 'deletar_imagem' foto_id=foto.id %}"
              ><button class="btn btn-danger col-12" style="padding: top 5px">
                Deletar
              </button></a
            >
          </div>
        </div>
      </div>
    </section>
  </section>
</main>

{% endblock %}
